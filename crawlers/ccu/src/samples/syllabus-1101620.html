<span lang="en" class="multilang">Folklore and Iconography</span><span lang="zh_tw" class="multilang">民俗與圖像</span>
<table><tr><td>一、課程概述</td><td colspan="7"><div class="text_to_html">概論民俗圖像在文化中的存在及意義，介紹民俗圖像的母題與類型，以日常生活中常見的各種視覺祝願為例，析解其中的民俗思惟及現實需求，使慣於以文字作為思考基準的學生，能充份體認圖像在生活中所占據的不可忽視的地位。</div></td></tr></table>
