<script>
        var cof_outline = {"courseCode": "EDU0011 ", "outline": "週次\t日期\t講授內容\r\n一\t\tIntroduction\r\n二\t\tconjunction\r\n三\t\tdisjunction\r\n四\t\tconditional\r\n五\t\tTautology, Contradictory, Contingent\r\n六\t", "brief": "在當代哲學的課程架構中，邏輯是必備的基礎學科。但邏輯學之所以為重中之重，並不是因為邏輯對於批判的思考與論證的過程有直接的助益；事實上邏輯系統千千萬萬種，哲學家對不同系統優劣的評判更是百家爭鳴，而形成新興學科如邏輯哲學。主要的原因在於，在哲學的許多其他學科如形上學、知識論、語言哲學乃至宗教哲學、科學哲學等，許多議題的研究帶動了現代邏輯的發展；而現代邏輯的諸多發現與進展，亦牽動上述領域中不同理論間的爭議。故若對邏輯無基本的認識，便完全不能理解大部分當代哲學探討的問題。至於價值哲學如倫理學、政治哲學與教育哲學等，雖然預設之邏輯知識未若前述學科來得多，但若欲在將來對教育有關哲學議題的探究上能游刃有餘，則邏輯依然是不可或缺的基本素養。\n\n        當然，一般通識教育中所開設之邏輯課程，亦會探討日常思考之方法，並辨別生活中常見之非形式推論謬誤。本課程所教授之形式邏輯系統，亦能完全掌握與解釋這些推", "briefEng": "Logic is a formal science which studies argument structures, focusing on the formal relationship between the premises and conclusion of an argument. Logic studies how to evaluate an argument (\"validity\" for deductive arguments), and studies the inference rules and proof methods for the purpose of inferring the conclusion from premises. This course is to introduce basic concepts in logic, inference rules, and proofs. This course will introduce students to contemporary first-order logic, including propositional logic and predicate logic. In the last two weeks or so, this course will introduce in a succinct manner further development in logics, including modal logics, many-valued logics, nad free logics.", "UpdEmpno": "彭孟堯", "EmpUpdTime": "2015-03-10 21:04:24.413", "updUser": "cjf", "updTime": "2023-07-28 15:24:04.99", "v_chnName": "邏輯", "v_engName": "Logic"};
