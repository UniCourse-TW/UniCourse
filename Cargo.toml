[workspace]
members = ["crates/api", "crates/catalog", "crates/ingest"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
homepage = "https://unicourse.observe.tw/"
repository = "https://github.com/UniCourse-TW/UniCourse"
readme = "README.md"
keywords = ["taiwan", "higher-education", "course-catalog", "course-search"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "migrate", "json"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"] }
utoipa = "5"
unicourse-catalog = { path = "crates/catalog" }

# Password hashing is far too slow unoptimized; keep debug builds and tests usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
